<style>
#tour{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(26,34,40,.62);padding:16px;font-family:'Barlow',Arial,sans-serif;}
#tour.on{display:flex;}
#tour.dock{background:transparent;align-items:flex-end;pointer-events:none;padding:0 14px 14px;} #tour.dock .tcard{pointer-events:auto;max-height:46vh;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px rgba(92,151,168,.35);}
.tcard{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.tbar{height:4px;background:#e8ecee;} .tbar i{display:block;height:100%;background:var(--accent,#5c97a8);transition:width .25s;}
.tbody{padding:22px 26px 6px;} .tstep{font:600 11px 'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink,var(--accent,#5c97a8));}
.tbody h2{font:700 24px/1.15 'Oswald',sans-serif;margin:6px 0 8px;color:#22303a;} .tbody p{font-size:15px;line-height:1.5;color:#3c4a53;margin:8px 0;}
.tbody ul{margin:8px 0;padding-left:20px;font-size:14.5px;line-height:1.5;color:#3c4a53;} .tbody li{margin:4px 0;} .tbody b{color:#22303a;}
.tmock{background:#f2f4f3;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13.5px;color:#3c4a53;}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 26px 18px;}
.tdots{display:flex;gap:6px;} .tdots i{width:7px;height:7px;border-radius:50%;background:#d5dcdf;} .tdots i.a{background:var(--accent,#5c97a8);}
.tbtn{font:600 14px 'Barlow',sans-serif;border:none;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--accent,var(--accent,#5c97a8));color:var(--on-accent,#fff);} .tbtn.g{background:transparent;color:#6b7680;padding:10px 8px;}
.t-hl{outline:3px solid var(--accent,#5c97a8);outline-offset:4px;border-radius:14px;transition:outline-color .2s;}
@media (max-width:520px){.tbody{padding:20px 18px 6px;} .tfoot{padding:12px 18px 16px;} .tbody h2{font-size:21px;}}
</style>
<div id="tour" role="dialog" aria-modal="true" aria-label="Guided tour"><div class="tcard">
  <div class="tbar"><i id="tprog"></i></div><div class="tbody" id="tbody"></div>
  <div class="tfoot"><button class="tbtn g" id="tskip">Skip tour</button><div class="tdots" id="tdots"></div><div><button class="tbtn g" id="tback">Back</button><button class="tbtn" id="tnext">Next</button></div></div>
</div></div>
<script>
(function(){
var FS={{ 'true' if ((team_program and is_fs(team_program)) or (bio is defined and bio and is_fs(bio.program or 'shepherds'))) else 'false' }}, STAGE='{{ tour_stage }}', NEXT='{{ tour_next|default('', true) }}', QS=new URLSearchParams(location.search), FIRST=QS.get('first')==='1';
var ALL={
dash:[
 {t:FIRST?'Your first upload worked':'Welcome to your dashboard',h:'<p>'+(FIRST?'Your players are on the board. ':'')+'This is your team\'s home base. Every player gets a card, and every card opens a live profile built from their <b>most recent outings</b>.</p><ul><li>Use the <b>search box</b> to find a player, school or position.</li><li>A player\'s <b>headshot</b> (or your school logo until you add one) is on the card, with class year and position.</li><li>Your data is private. Only your program\'s coaches and the admin can see it.</li></ul>'},
 {t:'Add more data anytime',only:'std',h:'<p>Tap <b>+ Upload a CSV</b> after each session.</p><ul><li>Every pitcher and hitter in the file is found automatically, and your own team is told apart from opponents.</li><li>On the review screen, fill in class year, height and weight (height is needed for the arm-angle graphic).</li><li>Choose <b>Game</b> or <b>Scrimmage</b> for game sessions. You enter the opponent, and you can add the <b>home plate umpire</b> (optional) for the umpire report.</li><li>If a pitch looks like it belongs to someone else, you\'ll get a flag and can leave it out, keep it or move it.</li><li>Use <b>Team roster</b> in the menu to add jersey numbers, positions and class years.</li></ul><div class="tmock">Uploading the same file twice is safe. Pitches are never double-counted. Every upload is listed in the <b>Upload log</b>.</div>'},
 {t:'Add more data anytime',only:'fs',h:'<p>Tap <b>+ Upload a CSV</b> after each Full Swing session.</p><ul><li>Every pitcher and hitter in the file is found automatically.</li><li>On the review screen, fill in class year, height and weight (height is needed for the arm-angle graphic).</li><li>Use <b>Team roster</b> in the menu to add jersey numbers, positions and class years.</li></ul><div class="tmock">Full Swing Live At Bat results are <b>predicted from the batted ball</b>, not actual outcomes, and pitch type and location are not in that data. Uploading the same file twice is safe. Every upload is listed in the <b>Upload log</b>.</div>'},
 {t:'Bring your staff and players in',h:'<p>The dashboard works best when the whole program uses it. Set this up early, from <b>Coaches &amp; players</b> in the menu.</p><ul><li><b>Assistant coaches</b> get their own logins. They can view everything for the team, download and print reports, and upload (you can turn their uploading off). They can\'t manage logins, change the team\'s look or delete data.</li><li><b>Player logins</b> (beta) give each player a page of his own, so he can see his numbers and how they are changing without waiting on you.</li><li>How many assistants you can add depends on your plan.</li></ul><div class="tmock">Every report you download or print is marked <b>Prepared for</b> the person who made it.</div>'},
 {t:'The Team Dashboard',h:'<p>The <b>Team Dashboard</b> pulls the whole staff\'s picture together, for pitching and for hitting.</p><ul><li><b>Team stats</b> and a <b>Leaderboard</b>, with Basic and Advanced stats you can sort by any column.</li><li><b>Movement over recent sessions</b> shows how the staff\'s pitch shapes are changing.</li><li><b>Team goals</b>: set a target for a stat and watch the team move toward it.</li><li><b>&#9733; Newest Personal Bests</b> lists every record broken in the last 30 days of sessions.</li></ul>'},
 {t:'Pitchers and Hitters',h:'<p>Each side of the ball has its own page with a card for every player.</p><ul><li><b>Pitchers</b>: tap one to open the full profile.</li><li><b>Hitters</b>: swing decisions, spray chart and exit velocity in one profile.</li><li><b>Swing Decisions</b> (from the Team Dashboard) shows every swing and take on a large plate view, from the catcher\'s view. Hover a pitch to see who it was and the count.</li><li>Hover any stat for its definition, or open the <b>Stats glossary</b> in the menu.</li></ul>'},
 {t:'Game Reports',only:'std',h:'<p><b>Game Reports</b> lists your schedule and a scorebook for every Game or Scrimmage you uploaded.</p><ul><li>Games you haven\'t uploaded yet have an <b>Upload Game Data</b> button, as a reminder for whoever tracked it.</li><li>If an opponent was entered wrong, use <b>Edit opponent</b> on the game card. Every pitch in that game updates, and a doubleheader stays together.</li><li>Open a game for the scorebook (pitch counts, pinch hitters, pitching changes, runners who scored) and a notes box for each team. <b>Full analysis</b> adds the lineup card, pitchers in order and how each arsenal compared with earlier outings.</li></ul>'},
 {t:'Umpire reports (staff only)',only:'std',h:'<p>Every game has an <b>Umpire</b> page that grades each called ball and strike against the zone, with a catcher\'s-view map of the misses.</p><ul><li>Enter the home plate umpire when you upload, or add the name on that page later.</li><li>The <b>Umpires</b> section of the Scouting page rolls the games up by umpire and shows whether he leans <b>pitcher friendly</b> or <b>hitter friendly</b>, once there are enough games to say.</li><li>Calls within an inch of the edge are never counted as misses, and this is never shown to players or on shared links.</li></ul>'},
 {t:'Scouting',only:'std',h:'<p>Every opponent you tracked gets its own <b>Scouting</b> dashboard, built from your Game and Scrimmage uploads.</p><ul><li>Their pitchers and hitters sit side by side, like a team dashboard.</li><li>Open a <b>scouting book</b> for one opponent, and add private notes on their players.</li><li>Add a logo for an opponent if it isn\'t already in the library.</li></ul>'},
 {t:'Catchers (beta)',only:'std',h:'<p>The <b>Catchers</b> page shows receiving, arm and pitch-calling tendencies for each catcher, built from Game, Scrimmage and Intrasquad pitches.</p><ul><li>Trackman records the catcher on every pitch, so upload those sessions with the Catcher column filled in.</li></ul>'},
 {t:'Outing Reports',only:'fs',h:'<p><b>Outing Reports</b> lists every session, newest first, with the pitchers who threw that day. Open one to see that pitcher\'s report.</p><ul><li>Each pitcher\'s profile has an <b>Open ArmCare</b> link to your team\'s ArmCare dashboard.</li></ul>'},
 {t:'Share a profile',h:'<p>Open any player and use the <b>share icon</b> in the top corner of his card to get a link.</p><ul><li>Anyone with the link sees his name, photo, bio and stats, with no sign-in. Good for recruits, families and camps.</li><li>It never shows team rankings, personal bests, coach insights or any other player. You can turn the link off at any time.</li></ul>'},
 {t:'Your profile menu',h:'<p>The circle at the top right is your <b>menu</b>, grouped by what you want to do.</p><ul><li><b>Team</b>: the dashboard, pitchers, hitters and '+(FS?'outing reports':'game reports and scouting')+'.</li><li><b>Data</b>: roster and the upload log.</li><li><b>Manage</b>: coaches and the team\'s appearance (colors and logo).</li><li><b>Help</b>: the stats glossary and this tour, any time.</li><li><b>My account</b>: your name and password.</li></ul><p>Next, we\'ll open a player\'s page.</p>'}
],
player:[
 {sel:['.head',''],t:'The player header',h:'<p>Name, position, class year, throwing hand, height and weight. Use <b>Edit Profile</b> any time to fix a name, class year, height, weight or headshot. Height powers the <b>arm angle</b> graphic below.</p>'},
 {sel:['#share',''],opt:1,t:'Share this profile',h:'<p>The <b>share icon</b> makes a link to a public version of this page: name, photo, bio and stats, with no sign-in. It never shows rankings, personal bests or insights, and you can turn it off.</p>'},
 {sel:['.gobtns',''],opt:1,t:'Personal Bests and outings',h:'<p>The buttons under the header take you to this player\'s <b>&#9733; Personal Bests</b> (every record he has set, and when) and to his <b>Outing Reports</b>. Newly broken records also show in a banner here.</p>'},
 {sel:['.ins',''],opt:1,t:'Coach Insights (beta)',h:'<p>Patterns that are large, show up across several sessions and hold when any single outing is removed, with a suggestion for what to look at. Treat them as the start of a conversation, not a verdict. Only you see this, never the player or a shared link.</p>'},
 {sel:['#stats',''],t:'Pitching profile tiles',h:'<p>Current form over the last 10 outings. By default you see <b>Strike %</b>, <b>Whiff %</b>, <b>In Zone %</b> and <b>Chase %</b>.</p><ul><li>Tap <b>Customize stats</b> to pick from 80+ stats (command, swing and miss, contact allowed, stuff, delivery and per-pitch-type). Hover any stat for its definition.</li><li>Each player keeps their own set.</li><li>Stats are placed on a <b>percentile scale</b> against college-level benchmarks: blue is below average, red is better, and 50 is average.</li></ul>'},
 {sel:['.pmp-panel',''],t:'Pitch Movement Profile',h:'<p>Each dot is one pitch from the pitcher\'s point of view: sideways (horizontal break) and up or down (induced vertical break), in inches.</p><ul><li>It shows a <b>sample of about 90 recent pitches</b> from his arsenal, so the movement patterns stay clear and not crowded.</li><li>The center is a pitch with no movement. The label at the top shows which side is toward first base and which is toward third.</li><li>Hover a dot for the pitch type and velocity. The table underneath shows usage, average mph and top mph by pitch type.</li></ul>'},
 {sel:['.pn-t','Pitch Effectiveness'],opt:1,t:'Pitch Effectiveness',h:'<p>Every pitch he throws, split by the batter\'s side, so you can see which pitch works against lefties and which against righties. Grey rows have under 10 pitches, so read them loosely.</p>'},
 {sel:['.loc-wrap',''],t:'Pitch Location',h:'<p>Where pitches crossed the plate, from the catcher\'s view: one chart against right-handed batters and one against lefties.</p><ul><li>Switch between <b>Dots Only, Heat Map or Both</b>, and filter by pitch type.</li><li>Red areas are where the most pitches were thrown.</li></ul>'},
 {sel:['.pn-t','Velocity Trend'],t:'Velocity and spin trends',h:'<p>Average velocity by pitch type across his recent outings, so you can spot a drop or gain at a glance. <b>Spin Rate Trend</b> below it does the same for spin.</p>'},
 {sel:['.pn-t','Pitches to Consider Adding'],opt:1,t:'Pitches to consider adding',h:'<p>Ideas for a pitch that could fit his arsenal, based on what he throws now. A starting point for a conversation with the pitcher.</p>'},
 {sel:['.pn-t','Closest MLB Arsenals'],opt:1,t:'Closest MLB arsenals',h:'<p>The big-league pitchers whose arsenals look most like his, built from his tracked pitches. Useful for showing a player what his mix resembles.</p>'},
 {sel:['.pn-t','Outing Reports'],t:'The outing log',h:'<p>Every outing, newest first, tagged <b>Live AB</b> or <b>Bullpen</b>, with pitches, top velocity and strike %.</p><ul><li>Tap an outing to open its full report.</li><li>Under each one, <b>Download to send</b> saves a single file you can email or text to the player.</li></ul><p>Let\'s open the most recent report.</p>'}
],
report:[
 {sel:['.chart-title','Outing Summary'],t:'Outing Summary',h:'<p>A box-score style summary for Live AB and game sessions: innings, batters faced, pitches, hits, walks and hit-by-pitch, then strike %, first-pitch strike %, in-zone rate, whiff rate, chase rate and average exit velocity.</p><div class="tmock">Innings, hits, walks and batters faced are <b>estimates</b> built from the pitch-by-pitch tags, so treat them as a close guide, not an official box score.</div>'},
 {sel:['.chart-title','Pitch Movement Profile'],t:'Movement for this outing',h:'<p>The same movement plot as the player page, but only for this session, with usage and velocity by pitch type underneath.</p>'},
 {sel:['.chart-title','Pitch Tracking'],t:'Pitch Tracking table',h:'<p>One row per pitch type: count, usage, strike %, average and top velocity, spin rate, spin direction and approach angle.</p>'},
 {sel:['.chart-title','Pitch Log'],t:'Pitch Log',h:'<p>Every pitch in order, with type, velocity, spin, movement, location and result.</p><ul><li>Click a row to find that pitch on the location chart above.</li></ul>'},
 {sel:['',''],t:'Sending this to your player',h:'<p>This page needs your login. To send it, go back to the player page and tap <b>Download to send</b> under the outing. You get a single file that works on its own, with no login. Email or text it, or print it to PDF from your browser.</p><p>That\'s the tour. You can replay it from your profile menu any time.</p>'}
]};
var S=(ALL[STAGE]||[]).filter(function(x){return !x.only||x.only===(FS?'fs':'std');}), i=0, el=document.getElementById('tour'), hl=null;
function find(sel){
  if(!sel||!sel[0])return null;var n=[].slice.call(document.querySelectorAll(sel[0]));
  if(sel[1]){n=n.filter(function(x){return (x.textContent||'').trim().indexOf(sel[1])===0;});}
  var x=n[0];if(!x)return null;if(!sel[1])return x;return x.closest('.pn')||x.closest('.chart-card')||x.parentElement||x;
}
function focusStep(){
  if(hl){hl.classList.remove('t-hl');hl=null;}
  var s=S[i];if(!s||STAGE==='dash')return;
  var t=find(s.sel);
  if(t){hl=t;t.classList.add('t-hl');setTimeout(function(){t.scrollIntoView({behavior:'smooth',block:'start'});},60);}
  else if(i===0||!s.sel||!s.sel[0]){window.scrollTo({top:0,behavior:'smooth'});}
}
function lastLabel(){return STAGE==='dash'?(NEXT?'Show me a player':'Got it'):STAGE==='player'?(NEXT?'Open an outing report':'Got it'):'Finish';}
function render(){
  var s=S[i];document.getElementById('tbody').innerHTML='<div class="tstep">Step '+(i+1)+' of '+S.length+'</div><h2>'+s.t+'</h2>'+s.h;
  document.getElementById('tprog').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('tdots').innerHTML=S.map(function(_,k){return '<i class="'+(k===i?'a':'')+'"></i>';}).join('');
  document.getElementById('tback').style.visibility=i?'visible':'hidden';
  document.getElementById('tnext').textContent=i===S.length-1?lastLabel():'Next';
  document.getElementById('tskip').style.visibility=i===S.length-1?'hidden':'visible';
  focusStep();
}
function done(){try{fetch('{{ url_for("onboarding_done") }}',{method:'POST',credentials:'same-origin'});}catch(e){}}
function open_(){if(STAGE==='player'){S=S.filter(function(x){return !x.opt||find(x.sel);});}if(!S.length)return;i=0;if(STAGE!=='dash')el.classList.add('dock');render();el.classList.add('on');}
function close_(){el.classList.remove('on');if(hl){hl.classList.remove('t-hl');hl=null;}done();
  try{var u=new URL(location.href);u.searchParams.delete('tour');u.searchParams.delete('first');history.replaceState(null,'',u.pathname+(u.search||''));}catch(e){}}
document.getElementById('tnext').onclick=function(){
  if(i<S.length-1){i++;render();return;}
  if(STAGE==='report'){done();location.href=NEXT||'/';return;}
  if(NEXT){location.href=NEXT;return;}
  close_();
};
document.getElementById('tback').onclick=function(){if(i>0){i--;render();}};
document.getElementById('tskip').onclick=close_;
el.addEventListener('click',function(e){if(e.target===el&&STAGE==='dash')close_();});
document.addEventListener('keydown',function(e){if(!el.classList.contains('on'))return;if(e.key==='Escape')close_();if(e.key==='ArrowRight')document.getElementById('tnext').click();if(e.key==='ArrowLeft')document.getElementById('tback').click();});
window.openTour=open_;
var q=QS.get('tour');if(q===STAGE||(q==='1'&&STAGE==='dash'))setTimeout(open_,250);
})();
</script>
