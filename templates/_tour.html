<style>
#tour{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(26,34,40,.62);padding:16px;}
#tour.on{display:flex;}
.tcard{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.tbar{height:4px;background:#e8ecee;} .tbar i{display:block;height:100%;background:#5c97a8;transition:width .25s;}
.tbody{padding:26px 28px 8px;} .tstep{font:600 11px 'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5c97a8;}
.tbody h2{font:700 26px/1.15 'Oswald',sans-serif;margin:6px 0 10px;color:#22303a;} .tbody p{font-size:15px;line-height:1.5;color:#3c4a53;margin:8px 0;}
.tbody ul{margin:8px 0;padding-left:20px;font-size:14.5px;line-height:1.5;color:#3c4a53;} .tbody li{margin:4px 0;} .tbody b{color:#22303a;}
.tmock{background:#f2f4f3;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13.5px;color:#3c4a53;}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 28px 22px;}
.tdots{display:flex;gap:6px;} .tdots i{width:7px;height:7px;border-radius:50%;background:#d5dcdf;} .tdots i.a{background:#5c97a8;}
.tbtn{font:600 14px 'Barlow',sans-serif;border:none;border-radius:999px;padding:10px 20px;cursor:pointer;background:#5c97a8;color:#fff;} .tbtn.g{background:transparent;color:#6b7680;padding:10px 8px;}
@media (max-width:520px){.tbody{padding:22px 20px 6px;} .tfoot{padding:12px 20px 18px;} .tbody h2{font-size:22px;}}
</style>
<div id="tour" role="dialog" aria-modal="true" aria-label="Dashboard tour"><div class="tcard">
  <div class="tbar"><i id="tprog"></i></div><div class="tbody" id="tbody"></div>
  <div class="tfoot"><button class="tbtn g" id="tskip">Skip tour</button><div class="tdots" id="tdots"></div><div><button class="tbtn g" id="tback">Back</button><button class="tbtn" id="tnext">Next</button></div></div>
</div></div>
<script>
(function(){
var KEY='ss_tour_done_{{ coach_key|e }}', S=[
{t:'Welcome to your dashboard',h:'<p>This is your team\'s home base. Every player you add gets a card, and every card opens a live profile built from their <b>most recent outings</b>.</p><ul><li>Use the <b>search box</b> to find a player, school or position.</li><li>A player\'s <b>headshot</b> (or school logo until you add one) is on the card, with class year and position.</li><li>Your players are private. Only you and the admin can see them.</li></ul><p>This 2-minute tour covers adding data, reading the numbers and sending reports. You can reopen it anytime from your <b>profile menu</b> (the circle at the top right) &rarr; <b>Take the tour</b>.</p>'},
{t:'Add players by uploading a Trackman .CSV',h:'<p>Everything starts with <b>+ Upload a .CSV</b>.</p><ul><li>Pick the Trackman export from your session. Every pitcher in the file is found automatically.</li><li><b>Review screen:</b> fill in class year, height and weight (height is needed for the arm-angle graphic) and optionally add a headshot.</li><li>Tick <b>Game / Live AB</b> only for game or live at-bat sessions. That adds the Outing Summary (innings, batters faced, hits, walks and so on). Leave it unchecked for bullpens.</li><li>If a pitch looks like it belongs to someone else (a mis-tagged name), you\'ll see a flag. Choose to leave it out, keep it, or move it to the right pitcher.</li></ul><div class="tmock">Uploading the same file twice is safe. Pitches are never double-counted.</div>'},
{t:'The player profile',h:'<p>Click any card. The top of the page is the player\'s <b>current form</b>, based on their last 10 outings.</p><ul><li><b>Strike %</b> &ndash; strikes out of all pitches.</li><li><b>Whiff %</b> &ndash; swings and misses out of all swings.</li><li><b>In Zone %</b> &ndash; pitches thrown in the strike zone.</li><li><b>Chase %</b> &ndash; swings at pitches outside the zone, out of all pitches outside the zone.</li></ul><p>Use <b>Customize stats</b> to choose which stats appear for this player (there are 80+ to pick from, and hovering one shows its definition). Use <b>Edit Profile</b> to fix a name, class year, height, weight or headshot at any time.</p>'},
{t:'Pitch Movement Profile',h:'<p>Each dot is one pitch, as the batter sees it: how far it moved sideways (horizontal break) and up or down (induced vertical break), in inches.</p><ul><li>The center is a pitch that doesn\'t move sideways or rise or drop compared with a straight throw. The farther from center, the more movement.</li><li><b>Hover</b> a dot to see its type and velocity.</li><li>The table underneath shows <b>usage, average mph and top mph</b> by pitch type.</li><li>The <b>arm angle</b> graphic shows the delivery slot (for example, around 0&deg; is sidearm, 90&deg; is straight over the top). It appears once you have entered the player\'s height.</li></ul>'},
{t:'Pitch Location and Velocity Trend',h:'<p><b>Pitch Location</b> shows where pitches crossed the plate from the catcher\'s view, one chart against right-handed batters and one against left-handed batters.</p><ul><li>Switch between <b>Dots Only, Heat Map or Both</b>, and filter by pitch type with the buttons.</li><li>Red areas are where the most pitches were thrown.</li><li>Hover a dot for the pitch type and result.</li></ul><p><b>Velocity Trend</b> plots average velocity by pitch type across the last 10 outings, so you can spot a velocity drop or gain.</p>'},
{t:'Outing reports',h:'<p>At the bottom of a player\'s page is the <b>log of every outing</b>, newest first, tagged <b>Live AB</b> or <b>Bullpen</b>.</p><ul><li>Tap an outing to open its full report: movement, location, spin and a pitch-by-pitch log.</li><li>Click a row in the pitch log to find that pitch on the location chart.</li><li>Live AB reports start with the <b>Outing Summary</b>. Innings, hits and walks are estimates built from the pitch-by-pitch tags, so treat them as a close guide, not an official box score.</li></ul>'},
{t:'Sending reports to your players',h:'<p>Under each outing in the log is <b>Download to send</b>.</p><ul><li>Tap it to save the report as a single file. It works on its own, with no login needed.</li><li><b>Email or text that file</b> to the player. They open it in any web browser on a phone or computer.</li><li>Want a PDF instead? Open the outing report, then use your browser\'s <b>Print</b> and choose <b>Save as PDF</b>.</li></ul><div class="tmock">Tip: the player profile page itself needs your login, so send the downloaded outing report, not a link to the website.</div><p>That\'s it. Start with <b>+ Upload a .CSV</b>.</p>'}
],i=0,el=document.getElementById('tour');
function safe(f){try{return f();}catch(e){return null;}}
function render(){
  var s=S[i];document.getElementById('tbody').innerHTML='<div class="tstep">Step '+(i+1)+' of '+S.length+'</div><h2>'+s.t+'</h2>'+s.h;
  document.getElementById('tprog').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('tdots').innerHTML=S.map(function(_,k){return '<i class="'+(k===i?'a':'')+'"></i>';}).join('');
  document.getElementById('tback').style.visibility=i?'visible':'hidden';
  document.getElementById('tnext').textContent=i===S.length-1?'Got it':'Next';
  document.getElementById('tskip').style.visibility=i===S.length-1?'hidden':'visible';
}
function open_(){i=0;render();el.classList.add('on');}
function close_(){el.classList.remove('on');safe(function(){localStorage.setItem(KEY,'1');});}
document.getElementById('tnext').onclick=function(){if(i<S.length-1){i++;render();}else close_();};
document.getElementById('tback').onclick=function(){if(i>0){i--;render();}};
document.getElementById('tskip').onclick=close_;
el.addEventListener('click',function(e){if(e.target===el)close_();});
document.addEventListener('keydown',function(e){if(!el.classList.contains('on'))return;if(e.key==='Escape')close_();if(e.key==='ArrowRight')document.getElementById('tnext').click();if(e.key==='ArrowLeft')document.getElementById('tback').click();});
window.openTour=open_;
if(location.search.indexOf('tour=1')>-1||!safe(function(){return localStorage.getItem(KEY);}))open_();
})();
</script>
