<style>
  #mv-tip{position:fixed;z-index:50;pointer-events:none;display:none;background:#26343b;color:#fff;font:600 12px/1.3 'Barlow',sans-serif;padding:6px 9px;border-radius:5px;white-space:nowrap;}
  #mv-tip.card{padding:0;background:#000;border-radius:10px;overflow:hidden;text-align:center;min-width:104px;} #mv-tip .tt-h{font:700 14px/1 'Barlow';padding:7px 12px;} #mv-tip .tt-b{padding:5px 12px 8px;color:#fff;} #mv-tip .tt-v{font:700 26px/1.05 'Oswald';} #mv-tip .tt-m{font:700 13px/1.2 'Barlow';margin-top:2px;}
</style>
<div id="mv-tip"></div>
<script>(function(){var tip=document.getElementById('mv-tip');function lum(h){var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(.299*r+.587*g+.114*b)/255;}
function build(el){var ty=el.getAttribute('data-ptype');if(!ty){tip.className='';tip.textContent=el.getAttribute('data-tip');return;}var c=el.getAttribute('data-pcolor'),v=el.getAttribute('data-pvelo');var fg=lum(c)>.62?'#1a1a1a':'#fff';tip.className='card';tip.innerHTML='<div class="tt-h" style="background:'+c+';color:'+fg+'">'+ty+'</div><div class="tt-b">'+(v?'<div class="tt-v">'+v+'</div>':'')+'<div class="tt-m">'+(el.getAttribute('data-psub')||('('+el.getAttribute('data-pivb')+'″, '+el.getAttribute('data-phb')+'″)'))+'</div></div>';}
document.querySelectorAll('.mv-pt').forEach(function(el){var t=el.querySelector('title');if(t)t.remove();el.addEventListener('mousemove',function(ev){build(el);tip.style.display='block';tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY+14)+'px';});el.addEventListener('mouseleave',function(){tip.style.display='none';});});})();</script>
